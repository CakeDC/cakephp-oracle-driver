name: Oracle CI

on:
  push:
    branches:
      - '5.x'
      - '5.next'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-tests:
    name: PHP ${{ matrix.php-version }} & Oracle (OCI8)
    runs-on: ubuntu-24.04

    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          # SYS / SYSTEM password
          ORACLE_PASSWORD: oracle_sys_password
          # Application user created inside FREEPDB1 (matches phpunit.xml db_dsn)
          APP_USER: app_user
          APP_USER_PASSWORD: AppUserTest123
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, apcu, oci8, pdo
          ini-values: apc.enable_cli = 1, zend.assertions = 1, date.timezone = UTC
          coverage: none

      - name: Wait for Oracle to be ready
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/oracle/1521) >/dev/null 2>&1; then
              echo "Oracle port is open"
              break
            fi
            echo "Waiting for Oracle ($i)..."
            sleep 5
          done

      - name: Composer install
        uses: ramsey/composer-install@v4

      - name: Run Oracle test suite
        run: php tests/run-database-tests.php
        env:
          # Points the active phpunit.xml (db_dsn) at the service container.
          # host=oracle matches the service name; FREEPDB1 + app_user are
          # created by the gvenzl image above.
          db_dsn: "oracle://app_user:AppUserTest123@FREEPDB1?className=CakeDC\\OracleDriver\\Database\\OracleConnection&driver=CakeDC\\OracleDriver\\Database\\Driver\\OracleOCI&host=oracle&port=1521&database=FREEPDB1&server_version=23&autoincrement=1&persistent=0"
          FIXTURE_SCHEMA_METADATA: "./tests/schema.php"
          ORACLE_RECREATE_SCHEMA: "1"
